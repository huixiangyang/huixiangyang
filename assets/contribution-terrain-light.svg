<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">Annual contribution terrain and source fingerprint</title>
  <desc id="description">A generative architectural landscape made from 365 days of public contributions, paired with a seal derived from the latest public commit.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efede6" />
      <stop offset="0.7" stop-color="#efede6" />
      <stop offset="1" stop-color="#e7e3da" />
    </linearGradient>
    <linearGradient id="terrainFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155367" stop-opacity="0.3" />
      <stop offset="0.66" stop-color="#76a5af" stop-opacity="0.08" />
      <stop offset="1" stop-color="#155367" stop-opacity="0" />
    </linearGradient>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#171b1c" opacity="0.04" />
    </pattern>
    <clipPath id="panelClip"><rect width="1200" height="350" rx="18" /></clipPath>
  </defs>
  <style>
    .label { fill: #566261; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 9px; letter-spacing: 0.17em; }
    .micro { fill: #7c8683; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 8px; letter-spacing: 0.12em; }
    .headline { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: -0.025em; }
    .count { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 26px; }
    .terrain-contour { fill: none; stroke: #76a5af; stroke-width: 1; }
    .terrain-column { stroke: #155367; stroke-width: 1; }
    .terrain-ridge { fill: none; stroke: #c45f43; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .seal-orbit { transform-origin: 1022px 194px; animation: seal-orbit 48s linear infinite; }
    .seal-pulse { transform-origin: 1022px 194px; animation: seal-pulse 5s ease-in-out infinite; }
    @keyframes seal-orbit { to { transform: rotate(360deg); } }
    @keyframes seal-pulse { 0%, 100% { opacity: 0.4; transform: scale(0.98); } 50% { opacity: 0.8; transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) { .seal-orbit, .seal-pulse { animation: none; } }
  </style>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="350" rx="18" fill="url(#surface)" />
    <rect width="1200" height="350" fill="url(#paper)" />
    <path d="M900 28V322M32 130H1168" fill="none" stroke="#bbc1bc" />
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="348.5" rx="17.25" fill="none" stroke="#909b98" stroke-opacity="0.72" stroke-width="1.5" />


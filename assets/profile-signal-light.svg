    <text class="micro" x="1144" y="311" text-anchor="end">PRESENT</text>
  </g>

  <g transform="translate(56 359)">
          <text class="metric-index" x="0" y="0">01</text>
          <text class="metric-value" x="38" y="0">65</text>
          <text class="metric-label" x="38" y="22">PUSH EVENTS / 90D</text>

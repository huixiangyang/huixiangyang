    <line class="day-rule" x1="624.0" y1="158" x2="624.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-0" cx="624.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="664.0" y1="158" x2="664.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-1" cx="664.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="704.0" y1="158" x2="704.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-2" cx="704.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="744.0" y1="158" x2="744.0" y2="292" opacity="0.44" />
          <circle class="signal-point point-3" cx="744.0" cy="263.0" r="4.4" />
          <line class="day-rule" x1="784.0" y1="158" x2="784.0" y2="292" opacity="0.44" />
          <circle class="signal-point point-4" cx="784.0" cy="176.0" r="4.4" />
          <line class="day-rule" x1="824.0" y1="158" x2="824.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-5" cx="824.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="864.0" y1="158" x2="864.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-6" cx="864.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="904.0" y1="158" x2="904.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-7" cx="904.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="944.0" y1="158" x2="944.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-8" cx="944.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="984.0" y1="158" x2="984.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-9" cx="984.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="1024.0" y1="158" x2="1024.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-10" cx="1024.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="1064.0" y1="158" x2="1064.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-11" cx="1064.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="1104.0" y1="158" x2="1104.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-12" cx="1104.0" cy="292.0" r="2.2" />
          <line class="day-rule" x1="1144.0" y1="158" x2="1144.0" y2="292" opacity="0.2" />
          <circle class="signal-point point-13" cx="1144.0" cy="292.0" r="2.2" />
    <path class="signal-line" d="M624.0 292.0 L664.0 292.0 L704.0 292.0 L744.0 263.0 L784.0 176.0 L824.0 292.0 L864.0 292.0 L904.0 292.0 L944.0 292.0 L984.0 292.0 L1024.0 292.0 L1064.0 292.0 L1104.0 292.0 L1144.0 292.0" />
    <circle class="endpoint-ring" cx="1144.0" cy="292.0" r="12" fill="none" stroke="#c45f43" stroke-width="1" />
    <circle cx="1144.0" cy="292.0" r="3.4" fill="#c45f43" />

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">Yang Huixiang live engineering field note</title>
  <desc id="description">An editorial visualization of recent public GitHub activity, generated daily.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efede6" />
      <stop offset="0.64" stop-color="#efede6" />
      <stop offset="1" stop-color="#e7e3da" />
    </linearGradient>
    <linearGradient id="signalStroke" x1="624" y1="0" x2="1144" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76a5af" />
      <stop offset="0.68" stop-color="#155367" />
      <stop offset="1" stop-color="#c45f43" />
    </linearGradient>
    <linearGradient id="signalArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155367" stop-opacity="0.18" />
      <stop offset="1" stop-color="#155367" stop-opacity="0" />
    </linearGradient>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#171b1c" opacity="0.045" />
    </pattern>
    <clipPath id="panelClip"><rect width="1200" height="410" rx="18" /></clipPath>
  </defs>

  <style>
    .label { fill: #566261; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 9px; letter-spacing: 0.18em; }
    .micro { fill: #7c8683; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 8px; letter-spacing: 0.12em; }
    .headline { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 54px; font-weight: 400; letter-spacing: -0.035em; }
    .headline-accent { fill: #c45f43; font-style: italic; }
    .principle { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 27px; font-style: italic; letter-spacing: -0.01em; }
    .mode { fill: #155367; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; }
    .metric-index { fill: #c45f43; font-family: Georgia, "Times New Roman", serif; font-size: 13px; font-style: italic; }
    .metric-value { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 25px; }
    .metric-label { fill: #7c8683; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 8px; letter-spacing: 0.12em; }
    .day-rule { stroke: #bbc1bc; stroke-width: 1; }
    .signal-point { fill: #efede6; stroke: #155367; stroke-width: 1.4; }
    .signal-line { fill: none; stroke: url(#signalStroke); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3 7; animation: drift 18s linear infinite; }
    .orbit { transform-origin: 934px 208px; animation: orbit 36s linear infinite; }
    .endpoint-ring { transform-origin: 1144.0px 292.0px; animation: pulse 3.4s ease-in-out infinite; }
    @keyframes drift { to { stroke-dashoffset: -80; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(0.74); opacity: 0.15; } 50% { transform: scale(1.35); opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) {
      .signal-line, .orbit, .endpoint-ring { animation: none; }
    }
  </style>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="410" rx="18" fill="url(#surface)" />
    <rect width="1200" height="410" fill="url(#paper)" />
    <path d="M594 28V318M32 326H1168" fill="none" stroke="#bbc1bc" />
    <path d="M16 82H42M16 124H28M1172 82H1184M1158 124H1184" fill="none" stroke="#909b98" stroke-width="1" />
    <g class="orbit" fill="none" stroke="#bbc1bc" stroke-width="1">
      <ellipse cx="934" cy="208" rx="224" ry="108" />
      <ellipse cx="934" cy="208" rx="176" ry="78" stroke-dasharray="2 8" />
      <path d="M710 208H1158M934 100V316" stroke-opacity="0.54" />
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="408.5" rx="17.25" fill="none" stroke="#909b98" stroke-opacity="0.72" stroke-width="1.5" />

  <g transform="translate(56 39)">
    <!-- Lucide Activity 图标 -->
    <g transform="translate(0 -4) scale(0.7)" fill="none" stroke="#155367" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
    </g>
    <text class="label" x="30" y="8">YANG HUIXIANG / LIVE FIELD NOTE</text>
  </g>
  <text class="micro" x="1144" y="47" text-anchor="end">UPDATED 23 AUG 2026 10:37 CST</text>

  <text class="headline" x="56" y="121">
    <tspan>Work</tspan><tspan class="headline-accent"> / </tspan><tspan>in motion</tspan>
  </text>
  <text class="label" x="58" y="151">PUBLIC ENGINEERING ACTIVITY, RENDERED AS A DAILY FIELD NOTE</text>

  <text class="label" x="56" y="211">TODAY&apos;S OPERATING PRINCIPLE</text>
  <text class="principle" x="56" y="252"><tspan x="56" dy="0">Ship the whole loop.</tspan></text>
  <line x1="56" y1="302" x2="168" y2="302" stroke="#c45f43" stroke-width="2" />
  <circle cx="181" cy="302" r="3" fill="#155367" />
  <text class="mode" x="197" y="306">DEEP WORK</text>

  <g>
    <text class="label" x="624" y="126">FOURTEEN-DAY FIELD TRACE</text>
    <text class="micro" x="1144" y="126" text-anchor="end">EVENT DENSITY / UTC</text>

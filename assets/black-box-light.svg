  <text class="label" x="50" y="135">CURRENT TRANSMISSION</text>
  <text x="50" y="168" fill="#171b1c" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">Measure before you guess.</text>
  <rect class="cursor" x="50" y="190" width="34" height="2" fill="#155367" />


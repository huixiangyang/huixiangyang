<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title description">
  <title id="title">Profile black box readout</title>
  <desc id="description">A hidden readout containing the latest public source signal and contribution summary.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efede6" />
      <stop offset="1" stop-color="#e7e3da" />
    </linearGradient>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.55" fill="#171b1c" opacity="0.04" />
    </pattern>
  </defs>
  <style>
    .label { fill: #566261; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 9px; letter-spacing: 0.17em; }
    .micro { fill: #7c8683; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 8px; letter-spacing: 0.11em; }
    .value { fill: #171b1c; font-family: "SFMono-Regular", "Cascadia Code", monospace; font-size: 11px; letter-spacing: 0.08em; }
    .headline { fill: #171b1c; font-family: Georgia, "Times New Roman", serif; font-size: 42px; letter-spacing: -0.03em; }
    .cursor { animation: cursor 1.6s steps(2, end) infinite; }
    @keyframes cursor { 50% { opacity: 0.18; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="1200" height="250" rx="16" fill="url(#surface)" />
  <rect width="1200" height="250" rx="16" fill="url(#paper)" />
  <rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="15.25" fill="none" stroke="#909b98" stroke-opacity="0.72" stroke-width="1.5" />

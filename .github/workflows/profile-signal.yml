name: Refresh profile signal

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 09:17 刷新，避开整点高峰。
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-signal
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate engineering signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-profile-signal.mjs

      - name: Commit refreshed signal
        run: |
          if git diff --quiet -- assets/profile-signal.svg; then
            echo "Profile signal is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-signal.svg
          git commit -m "chore: refresh profile signal"
          git push

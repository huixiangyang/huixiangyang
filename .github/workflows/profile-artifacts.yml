name: Refresh profile artifacts

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 09:17 刷新，避开整点高峰。
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-artifacts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate profile artifacts with Source Atlas
        uses: huixiangyang/source-atlas@v1
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          display-name: Yang Huixiang
          initials: YH
          modules: field-note,terrain,black-box
          theme: both
          output-dir: assets
          timezone: Asia/Shanghai
          timezone-label: CST

      - name: Commit refreshed artifacts
        run: |
          if git diff --quiet -- assets/profile-signal-*.svg assets/contribution-terrain-*.svg assets/black-box-*.svg; then
            echo "Profile artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-signal-*.svg assets/contribution-terrain-*.svg assets/black-box-*.svg
          git commit -m "chore: refresh profile artifacts"
          git push
